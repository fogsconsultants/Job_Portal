{% extends 'base.html' %}
{% block title %}
  Create Account | CareerCanvas
{% endblock %}
{% block content %}
  <section class="auth-page container">
    <div class="auth-card">
      <p class="eyebrow">START YOUR JOURNEY</p><h1>Create your account.</h1><p>Save time when you are ready to apply.</p>
      <form method="post" onsubmit="return passwordValidate()">
        {% csrf_token %}
        <div class="field-row">
          <div class="field">
            <label for="first_name">First name</label><input type="text" id="first_name" name="first_name" required />
          </div>
          <div class="field">
            <label for="last_name">Last name</label><input type="text" id="last_name" name="last_name" required />
          </div>
        </div>
        <div class="field">
          <label for="email">Email address</label><input type="email" id="email" name="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label><input type="password" id="password" name="password" required />
        </div>
        <div class="field">
          <label for="confirm_password">Confirm password</label><input type="password" id="confirm_password" name="confirm_password" required />
        </div><button class="button button-full" type="submit">Create account →</button>
      </form>
      <p class="auth-switch">
        Already have an account? <a href="{% url 'login' %}">Sign in</a>
      </p>
    </div>
  </section>
  <script>
    function passwordValidate() {
      if (password.value !== confirm_password.value) {
        alert('Passwords must match.')
        return false
      }
      return true
    }
  </script>
{% endblock %}
